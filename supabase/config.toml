# Minimal project config for Edge Function deploy settings.
# Stripe cannot send a Supabase JWT, so the webhook must skip gateway auth.
# Signature verification still happens inside the function via STRIPE_WEBHOOK_SECRET.
# Recovery email template: see supabase/templates/recovery.html and docs/AUTH.md

[functions.stripe-webhook]
verify_jwt = false

[functions.request-password-reset]
verify_jwt = false

[functions.bootstrap-stripe-plans]
verify_jwt = false
